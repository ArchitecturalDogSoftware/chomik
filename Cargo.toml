[package]
name = "chomik"
description = "To hamster"
authors = ["Jaxydog", "RemasteredArch"]
version = "0.1.0"
readme = true
license = "GPL-3.0-or-later"

edition.workspace = true
repository.workspace = true
publish.workspace = true

[workspace]
resolver = "3"
members = ["lib/*"]

package.edition = "2024"
package.repository = "https://github.com/ArchitecturalDogSoftware/chomik"
package.publish = false

[workspace.dependencies]
chomik_extract = { path = "./lib/chomik_extract/", version = "*" }
qrc_parse = { path = "./lib/qrc_parse/", version = "*" }
image = { version = "0.25.10", default-features = false, features = ["rayon", "jpeg"] }
thiserror = "2.0"
tracing = "0.1"

[workspace.lints]
clippy.cargo = { level = "warn", priority = -1 }
clippy.nursery = { level = "warn", priority = -1 }
clippy.pedantic = { level = "warn", priority = -1 }

clippy.multiple_crate_versions = "allow"  # Inevitable with a Bevy project.

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["2d"] }
carp = { git = "https://github.com/Jaxydog/carp", version = "0.1.0" }
chomik_extract.workspace = true
image.workspace = true
rand = "0.10.2"
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["dev"]  # Enabled for now so that rust-analyzer behaves nicely.
dev = ["bevy/dev"]

[lints]
workspace = true

[profile.dev]
opt-level = 1
package."*".opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
